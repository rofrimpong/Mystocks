name: MyStocks Frontend Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag for the production ZIP'
        required: true
        default: 'frontend-v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Verify PWA build
        run: |
          test -f dist/pwa-192x192.png
          test -f dist/pwa-512x512.png
          test -f dist/apple-touch-icon.png
          test -f dist/favicon.ico
          test -f dist/manifest.webmanifest

      - name: Create production ZIP
        run: |
          cd dist
          zip -r ../../mystocks-frontend-dist.zip .

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: MyStocks Frontend ${{ inputs.release_tag }}
          body: |
            Production frontend build for CNMG STOCKS.
            
            Built by GitHub Actions using Node.js 22.
          files: mystocks-frontend-dist.zip
          make_latest: true

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mystocks-frontend-dist
          path: frontend/dist
          if-no-files-found: error
